# Defaults for every run. An experiment file in configs/experiments/ overrides any of these;
# `python scripts/train.py --config <experiment> key=value` overrides on top.
# The defaults reproduce the batch-32 runs of 2026-10-12 (docs/EXPERIMENTS.md).

experiment:
  name: adhoc                  # runs go to runs/<experiment.name>/<run name>/

model:                         # original nanoTabPFN sizes
  embedding_size: 96
  num_attention_heads: 4
  mlp_hidden_size: 192
  num_layers: 3
  num_outputs: 2

train:
  seed: 0
  steps: 3000
  batch_size: 32
  lr: 0.004                    # original nanoTabPFN value; stable at batch 32 (Colab check, 2026-10-11)
  clip_grad_norm: 1.0
  save_at_steps: [3000]        # checkpoints, saved with the schedule-free evaluation weights
  device: auto                 # auto = cuda > mps > cpu

data:
  pools_dir: artifacts/dumps
  pools:                       # prior name -> training pool file in pools_dir (seed 0 pools)
    graph_scm: generic_graph_scm_100k_256x24_seed0.h5
    fintfm: finance_100k_256x24_seed0.h5
  mixture: {graph_scm: 1.0}    # ordered {prior: share}, first = base; see src/tfmprior/data/loader.py
  split_sizes: [80, 96, 112, 128, 144, 160, 176, 192, 208, 224]   # train rows per batch, drawn per batch

eval:
  after_train: true            # evaluate every checkpoint at the end of scripts/train.py
  benchmark_cache: artifacts/benchmark_cache
  suites: [finance, general]
  n_folds: 5
  max_datasets_per_suite: null # set a small number only for smoke tests
  validation:                  # held-out synthetic tables, scored at every checkpoint (loss and AUC)
    n_tables: 100
    pools:                     # prior name -> validation pool file in data.pools_dir (seed 1, never trained on)
      graph_scm: generic_graph_scm_1k_256x24_seed1.h5
      fintfm: finance_1k_256x24_seed1.h5
  health:                      # fixed before any run (EXPERIMENT.md 4.4); never changed after seeing results
    healthy_prior_auc: 0.65
    healthy_breast_cancer_auc: 0.9
    collapsed_prior_auc: 0.55
    collapsed_breast_cancer_auc: 0.6

output:
  runs_dir: runs
