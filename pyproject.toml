[project]
name = "nanotabpfn-main"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "ipykernel>=7.4.0",
    "numpy>=2.4.6",
    "openml>=0.15.1",
    "schedulefree>=1.4.1",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "tabicl>=2.2.0",
    "tabpfn==2.2.1",
    "torch<2.9",
    "xgboost>=3.2.0",
]

[project.scripts]
nanotabpfn-main = "nanotabpfn_main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
